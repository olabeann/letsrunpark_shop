<body data-page="checkout">
<div id="storeHeader"></div>
<main id="store">
<section id="checkoutPage" class="store-page"><a class="back-link" href="products.html">← 쇼핑 계속하기</a><p class="eyebrow">CHECKOUT</p><h1 tabindex="-1">주문·결제</h1><div class="checkout-layout"><div id="checkoutFields"><form id="checkoutForm"><h2>회원정보</h2><p class="required-guide"><span class="required-mark">*</span> 필수 입력 항목</p><label>이름 <span class="required-mark">*</span><input required name="name" autocomplete="name" placeholder="이름" /></label><label>전화번호 <span class="required-mark">*</span><input required name="phone" type="tel" autocomplete="tel" placeholder="010-0000-0000" /></label><div class="address-fields"><label for="postcode">주소 <span class="required-mark">*</span></label><div class="address-search-row"><input id="postcode" name="postcode" required inputmode="numeric" autocomplete="postal-code" placeholder="우편번호" aria-label="우편번호" /><button id="searchAddress" type="button" class="outline">주소 검색</button></div><input id="baseAddress" name="address" required autocomplete="address-line1" placeholder="기본주소를 입력하거나 검색해 주세요" aria-label="기본주소" /><label class="detail-address-label" for="detailAddress">상세주소 <span class="optional-mark">선택</span></label><input id="detailAddress" name="detailAddress" autocomplete="address-line2" placeholder="동·호수 등 상세주소" aria-label="상세주소" /><p id="addressStatus" role="status" class="address-status"></p></div><label>배송메모<input name="request" placeholder="문 앞에 놓아주세요 (선택)" /></label><div class="payment-note"><h3>구매 전 확인사항</h3><ul id="purchaseNotices"></ul><label class="purchase-agreement"><input id="purchaseAgreement" name="purchaseAgreement" type="checkbox" required /><span>구매·배송·취소·반품 조건을 확인하고 동의합니다. (필수)</span></label><label class="purchase-agreement"><input id="privacyAgreement" name="privacyAgreement" type="checkbox" required /><span>주문 및 배송을 위한 개인정보 수집·이용에 동의합니다. (필수)</span></label></div><button class="primary" disabled>결제하기</button></form></div><aside id="checkoutSummary" class="checkout-summary"></aside></div></section>
</main>
<div id="storeFooter"></div>
<div id="addressModal" class="address-overlay" hidden><section class="address-modal" role="dialog" aria-modal="true" aria-labelledby="addressTitle"><div class="panel-head"><h2 id="addressTitle">주소 검색</h2><button type="button" class="close" id="closeAddress" aria-label="주소 검색 닫기">×</button></div><div id="addressSearchContainer"></div></section></div>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" defer></script>

</body>
