<section id="operationsView"><div class="page-heading"><div><h1>스토어 운영 설정</h1><p>배송·취소·반품 기준과 구매 안내 문구를 관리합니다.</p></div><div class="heading-actions"><button id="saveStoreSettings" type="submit" form="inlineSettingsForm" class="blue">설정 저장</button></div></div><nav class="operations-jump-nav" aria-label="온라인 스토어 운영 메뉴"><a id="operationBannerTab" href="admin-banner.html" data-operation-tab="operationBanner">배너 관리</a><a id="operationProductsTab" href="admin-products.html" data-operation-tab="operationProducts">상품 관리</a><a id="operationDiscountsTab" href="admin-discounts.html" data-operation-tab="operationDiscounts">할인 관리</a><a id="operationSettingsTab" href="admin-settings.html" data-operation-tab="operationSettings">스토어 운영 설정</a></nav><section id="operationSettings" class="settings-summary store-settings-card"><form id="inlineSettingsForm" class="store-settings-form"><p id="inlineSettingsStatus" class="store-settings-status" role="status"></p><div class="store-settings-fields"><label><span>고정 배송비 <em>*</em></span><div class="settings-unit-input"><input name="shippingFee" type="number" min="0" step="100" required><span>원</span></div><small>모든 주문에 동일하게 적용됩니다.</small></label><label><span>결제 후 취소 가능 시간 <em>*</em></span><div class="settings-unit-input"><input name="cancelHours" type="number" min="1" step="1" required><span>시간</span></div><small>운송장 등록 전 주문에만 적용됩니다.</small></label><label><span>운송장 등록 후 반품 신청 기간 <em>*</em></span><div class="settings-unit-input"><input name="returnDays" type="number" min="1" max="365" step="1" required><span>일</span></div><small>기본 14일이며 신규 주문부터 적용됩니다.</small></label><label><span>기본 택배사 <em>*</em></span><select id="defaultCarrier" name="defaultCarrier" required></select><small>송장 미등록 주문의 기본값입니다.</small></label><label><span>단순 변심 반품비 기본값 <em>*</em></span><div class="settings-unit-input"><input id="returnShippingFee" name="returnShippingFee" type="number" min="0" step="100" required><span>원</span></div><small>환불 처리 시 불러오며 건별 수정할 수 있습니다.</small></label></div><div class="store-settings-copy"><label><span>배송 안내 문구 <em>*</em></span><textarea name="shippingNotice" rows="4" required></textarea><small>모든 상품 상세 상단의 배송비·판매 상태 아래, 수량 선택 위 ‘배송 안내’ 영역에 표시됩니다. 입력한 줄바꿈도 그대로 표시됩니다.</small></label><label><span>반품 주소 <em>*</em></span><textarea name="returnAddress" rows="4" required></textarea><small>고객이 반품을 신청하면 주문 상세에 표시됩니다.</small></label><label><span>구매 전 확인사항 <em>*</em></span><textarea name="purchaseNoticesText" rows="7" required></textarea><small>주문·결제 화면의 ‘구매 전 확인사항’에 표시됩니다. 줄바꿈을 포함해 입력한 내용이 그대로 표시되며, 배송비·취소시간·반품기간은 직접 작성해 주세요.</small></label></div></form></section></section>
